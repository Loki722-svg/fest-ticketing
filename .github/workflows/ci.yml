name: Fest Ticketing CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:

  test:
    name: Code Quality and Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r booking-service/requirements.txt
          pip install flake8

      - name: Lint
        run: |
          flake8 booking-service/app payment-service \
            --select=E9,F63,F7,F82

      - name: Run tests
        working-directory: booking-service
        run: pytest -q

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - booking-service
          - payment-service
          - frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fest-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fest-${{ matrix.service }}:${{ github.sha }}
